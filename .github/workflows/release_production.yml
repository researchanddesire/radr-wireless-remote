name: Publish verified production legacy alias

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Validated immutable release UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    environment: firmware-production
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download and verify immutable release
        id: release
        run: |
          python .github/scripts/download_verified_release.py \\
            --release-id "${{ inputs.release_id }}" \\
            --track main \\
            --device radr \\
            --output firmware

      - name: Replace explicit production alias
        run: |
          supabase storage rm "ss:///radr-firmware/production/firmware.bin" "ss:///radr-firmware/production/partitions.bin" "ss:///radr-firmware/production/bootloader.bin" "ss:///radr-firmware/production/littlefs.bin" \\
            "ss:///radr-firmware/production/manifest.json" \\
            "ss:///radr-firmware/production/version.json" --experimental --yes || true
          [[ ! -f "./firmware/firmware.bin" ]] || supabase storage cp "./firmware/firmware.bin" "ss:///radr-firmware/production/firmware.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
          [[ ! -f "./firmware/partitions.bin" ]] || supabase storage cp "./firmware/partitions.bin" "ss:///radr-firmware/production/partitions.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
          [[ ! -f "./firmware/bootloader.bin" ]] || supabase storage cp "./firmware/bootloader.bin" "ss:///radr-firmware/production/bootloader.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
          [[ ! -f "./firmware/littlefs.bin" ]] || supabase storage cp "./firmware/littlefs.bin" "ss:///radr-firmware/production/littlefs.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
          sed "s/{{ branchName }}/production/g" .github/artifacts/manifest.json > ./firmware/legacy-manifest.json
          supabase storage cp ./firmware/legacy-manifest.json "ss:///radr-firmware/production/manifest.json" --content-type "application/json" --cache-control "no-cache" --experimental
          supabase storage cp ./firmware/version.json "ss:///radr-firmware/production/version.json" --content-type "application/json" --cache-control "no-cache" --experimental

      - name: Summary
        run: echo "production now points to validated release ${{ inputs.release_id }} (v${{ steps.release.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
