name: Publish verified production legacy alias

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Validated immutable release UUID
        required: true
        type: string

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    environment: firmware-production
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
    steps:
      - name: Generate version-control token
        id: version_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.version_token.outputs.token }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download and verify immutable release
        id: release
        run: |
          python .github/scripts/download_verified_release.py \
            --release-id "${{ inputs.release_id }}" \
            --track main \
            --device radr \
            --output firmware

      - name: Replace production Supabase aliases
        run: |
          for ALIAS in master production; do
            supabase storage rm "ss:///radr-firmware/$ALIAS/firmware.bin" "ss:///radr-firmware/$ALIAS/partitions.bin" "ss:///radr-firmware/$ALIAS/bootloader.bin" "ss:///radr-firmware/$ALIAS/littlefs.bin" \
              "ss:///radr-firmware/$ALIAS/manifest.json" \
              "ss:///radr-firmware/$ALIAS/version.json" --experimental --yes || true
            [[ ! -f "./firmware/firmware.bin" ]] || supabase storage cp "./firmware/firmware.bin" "ss:///radr-firmware/$ALIAS/firmware.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            [[ ! -f "./firmware/partitions.bin" ]] || supabase storage cp "./firmware/partitions.bin" "ss:///radr-firmware/$ALIAS/partitions.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            [[ ! -f "./firmware/bootloader.bin" ]] || supabase storage cp "./firmware/bootloader.bin" "ss:///radr-firmware/$ALIAS/bootloader.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            [[ ! -f "./firmware/littlefs.bin" ]] || supabase storage cp "./firmware/littlefs.bin" "ss:///radr-firmware/$ALIAS/littlefs.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            sed "s/{{ branchName }}/$ALIAS/g" .github/artifacts/manifest.json > ./firmware/legacy-manifest.json
            supabase storage cp ./firmware/legacy-manifest.json "ss:///radr-firmware/$ALIAS/manifest.json" --content-type "application/json" --cache-control "no-cache" --experimental
            supabase storage cp ./firmware/version.json "ss:///radr-firmware/$ALIAS/version.json" --content-type "application/json" --cache-control "no-cache" --experimental
          done

      - name: Prepare GitHub Pages latest bridge
        run: |
          test -f firmware/firmware.bin
          rm -rf docs/v/latest
          mkdir -p docs/v/latest
          cp firmware/firmware.bin docs/v/latest/firmware.bin
          cp firmware/version.json docs/v/latest/version.json
          rm -rf firmware

      - name: Publish GitHub Pages latest bridge
        run: |
          git add docs/v/latest
          if git diff --cached --quiet; then
            echo "docs/v/latest already points to this release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "AJ"
          git config user.email "ajay.koenig@gmail.com"
          git commit -m "Publish production firmware ${{ steps.release.outputs.version }}"
          git push origin HEAD:main

      - name: Summary
        run: echo "master, production, and docs/v/latest now point to validated release ${{ inputs.release_id }} (v${{ steps.release.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

  rebuild-registry:
    needs: alias
    uses: ./.github/workflows/registry_rebuild.yml
    secrets: inherit
